name: Vzdálený přístup na macOS GUI

on:
  workflow_dispatch: # Spustí se ručně tlačítkem v záložce Actions

jobs:
  macos-vnc:
    runs-on: macos-latest
    timeout-minutes: 360 # Maximální doba běhu (6 hodin)
    steps:
      - name: Povolení VNC a nastavení hesla
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes
          echo "MojeTajneHeslo123" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent -console

      - name: Instalace a spuštění ngrok tunelu
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          brew install ngrok
          ngrok config add-authtoken "$NGROK_AUTH_TOKEN"
          ngrok tcp 5900 --log=stdout > ngrok.log &
          sleep 5
          grep -o "tcp://[^ ]*" ngrok.log

      - name: Udržení Macu v chodu
        run: sleep 21000

