name: Build na macOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Stažení kódu z repozitáře
        uses: actions/checkout@v4

      - name: Kontrola prostředí na Macu
        run: |
          sw_vers
          xcodebuild -version
