name: MacRDP-Zrok
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Remote Desktop and Zrok
        env:
          ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}
          REMOTE_USER: runneradmin
          REMOTE_PASS: P@ssw0rd!123  # Změňte si podle sebe
          VNC_PASSWORD: runnerrdp
        run: |
          # Vytvoření skriptu start.sh přímo v běhu (vložíte kód, který jste mi poslal)
          cat << 'EOF' > start.sh
          ${{ volitelný_obsah_vašeho_skriptu_výše }}
          EOF
          
          # Spuštění skriptu
          chmod +x start.sh
          ./start.sh

      - name: Display Connection Info
        run: |
          echo "=========================================="
          echo "Username: runneradmin"
          echo "Password: P@ssw0rd!123"
          echo "VNC Password: runnerrdp"
          echo "Zkontrolujte logy výše pro 'Remote endpoint' (tcp://...)"
          echo "=========================================="

      - name: Start Tmate Session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false

